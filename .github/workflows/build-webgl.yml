name: Build WebGL client

on:
  push:
    branches: [CardGame_Prototype]
    paths:
      - "CardGame_Prototype/Assets/**"
      - "CardGame_Prototype/Packages/**"
      - "CardGame_Prototype/ProjectSettings/**"
      - ".github/workflows/build-webgl.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: CardGame_Prototype/Library
          key: Library-WebGL-${{ hashFiles('CardGame_Prototype/Assets/**', 'CardGame_Prototype/Packages/**', 'CardGame_Prototype/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL client
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: CardGame_Prototype
          unityVersion: 6000.5.6f1
          targetPlatform: WebGL
          buildMethod: BuildScript.BuildWebGLClient

      - name: Upload WebGL build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cabboo-webgl-client
          # BuildScript.BuildWebGLClient() writes to "build/WebGL" relative
          # to the Unity project's working directory, which is projectPath.
          path: CardGame_Prototype/build/WebGL
          retention-days: 14
          if-no-files-found: error

      - name: Deploy WebGL client to Vercel
        # game-ci/unity-builder runs as root inside its container, so
        # build/WebGL ends up root-owned and this (non-root) step can't
        # write a .vercel/project.json link file into it. Passing
        # VERCEL_ORG_ID/VERCEL_PROJECT_ID as env vars instead avoids
        # needing to write anything into the build output directory.
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy CardGame_Prototype/build/WebGL --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
