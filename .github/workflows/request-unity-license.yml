name: Request Unity license activation file

# One-time-use workflow. Run it manually from the Actions tab, download the
# .alf artifact it produces, upload that at https://license.unity3d.com/manual
# to get back a .ulf license file, then add that .ulf file's contents as the
# UNITY_LICENSE repo secret. Once UNITY_LICENSE/UNITY_EMAIL/UNITY_PASSWORD
# are all set, this workflow file can be deleted - it's only needed once.
on:
  workflow_dispatch: {}

jobs:
  request-activation-file:
    name: Request activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.5.6f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.5.6f1.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
          retention-days: 3
